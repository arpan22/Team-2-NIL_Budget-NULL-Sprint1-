openapi: '3.0.3'
info:
  title: CUSports
  version: '1.0'
servers:
  - url: https://api.server.test/v1
paths:
  /accounts:
    get:
      summary: List accounts by type
      description: >-
        Allows a CUSports admin to review user information by listing all
        customer accounts or all employee accounts. Employee accounts are
        those with a BU, admin, CSR, warehouse, or shipper account type.
      operationId: listAccountsByType
      tags:
        - Accounts
      security:
        - bearerAuth: []
      parameters:
        - name: account_type
          in: query
          required: true
          description: Which group of accounts to return.
          schema:
            type: string
            enum:
              - customer
              - employee
      responses:
        '200':
          description: All accounts of the requested type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '400':
          description: The account type is not customer or employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The account type is invalid.
        '403':
          description: The requester is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Only admins can view accounts.
    post:
      summary: Add an employee user type
      description: >-
        Allows a CUSports admin to add one of the five employee user types:
        business user (BU), admin, customer service representative (CSR),
        warehouse, or shipper. Send updateField as "account_type" and the
        type in updateValue. Repeat the request once for each type.
      operationId: addUserType
      tags:
        - Accounts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update'
            examples:
              businessUser:
                value:
                  updateField: account_type
                  updateValue: BU
              admin:
                value:
                  updateField: account_type
                  updateValue: admin
              customerServiceRep:
                value:
                  updateField: account_type
                  updateValue: CSR
              warehouse:
                value:
                  updateField: account_type
                  updateValue: warehouse
              shipper:
                value:
                  updateField: account_type
                  updateValue: shipper
      responses:
        '201':
          description: The user type was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update'
              example:
                message: The user type has been successfully added.
        '400':
          description: The type is not one of the five employee types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The user type is invalid.
        '403':
          description: The requester is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Only admins can add user types.
        '409':
          description: The user type has already been added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The user type already exists.
  /accounts/{id}:
    get:
      summary: Look up an account by user id
      description: >-
        Allows a CUSports admin to look up any account, customer or employee,
        by its user id.
      operationId: getAccountById
      tags:
        - Accounts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user account.
          schema:
            type: string
      responses:
        '200':
          description: The account's information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '403':
          description: The requester is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Only admins can look up accounts.
        '404':
          description: No account exists with that user id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The user was not found.
    patch:
      summary: Update password
      description: Allows a registered customer to update their account password by providing their current password and a new password.
      operationId: updateAccountPassword
      tags:
        - Accounts
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user account.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update'
      responses:
        '200':
          description: Password successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update'
              example:
                updatePassword:
                  message: Password has been successfully updated.
        '400':
          description: The new password does not meet password requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The new password is invalid.
        '401':
          description: The current password provided is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The current password is incorrect.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Account:
      type: object
      required:
        - account_id
        - name
        - email
        - password
        - account_type
      properties:
        account_id:
          type: string
          description: The unique identifier of the account.
        name:
          type: string
          description: The account holder's full name.
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        preferences:
          type: object
          properties:
            payment:
              type: string
              description: User's preferred payment method.
              enum:
                - PayPal
                - credit_card
                - debit_card
            notifications:
              type: string
              description: User's preferred method of recieving notifications.
              enum:
                - SMS
                - Email
            promotion:
              type: boolean
              description: Whether the user opts in to promotional messages.
        account_type:
          type: array
          description: The roles assigned to this account. An account may hold more than one.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccountType'
        last_login_date:
          type: string
          format: date-time
    AccountType:
      type: string
      enum:
        - customer
        - BU
        - admin
        - warehouse
        - shipper
        - CSR
    Update:
      type: object
      description: >-
        Changes one account field. For most fields, send updateField and
        updateValue. To change the password, send updatePassword instead.
      properties:
        updateField:
          type: string
          description: Name of the account field being updated.
          example: email
        updateValue:
          type: string
          description: The new value for the field.
          example: new.email@example.com
        message:
          type: string
          readOnly: true
          description: Result of the update, returned in the response.
        updatePassword:
          type: object
          description: Used only when changing the password.
          required:
            - currentPassword
            - newPassword
          properties:
            currentPassword:
              type: string
              format: password
              writeOnly: true
              description: The user's existing password.
            newPassword:
              type: string
              format: password
              writeOnly: true
              description: >-
                The new password. Must be at least 8 characters long and
                include an uppercase letter, a lowercase letter, a number, and
                a special character.
              minLength: 8
            message:
              type: string
              readOnly: true
              description: Result of the password update, returned in the response.
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
