openapi: '3.0.3'
info:
  title: CUSports
  version: '1.0'
servers:
  - url: https://api.server.test/v1
paths:
  /accounts:
    get:
      summary: List accounts by type
      description: >-
        Allows a CUSports admin to review user information by listing all
        customer accounts or all employee accounts. Employee accounts are
        those with a BU, admin, CSR, warehouse, or shipper account type.
      operationId: listAccountsByType
      tags:
        - Accounts
      security:
        - bearerAuth: []
      parameters:
        - name: account_type
          in: query
          required: true
          description: Which group of accounts to return.
          schema:
            type: string
            enum:
              - customer
              - employee
        - name: sort
          in: query
          required: false
          description: >-
            Optional. Set to last_login_date to sort the returned accounts by
            the date and time of their last login, from latest to oldest.
          schema:
            type: string
            enum:
              - last_login_date
      responses:
        '200':
          description: All accounts of the requested type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '400':
          description: The account type is not customer or employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The account type is invalid.
        '401':
          description: >-
            The requester did not provide credentials, the token is invalid,
            or the requester is not an employee or admin account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Admin credentials required to proceed in action.
        '403':
          description: The requester is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Invalid credentials, unable to proceed in action.
    post:
      summary: Creates a new account
      description:
        Creates a new account. Anybody can create a customer account, but a set of admin credentials are required to create employee accounts.
      operationId: addAccount
      tags:
        - Accounts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CustomerAccount'
                - $ref: '#/components/schemas/EmployeeAccount'
      responses:
        '201':
          description: The account was added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserIDResponse'
        '400':
          description: >-
            The account details or type is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The user type is invalid.
        '401':
          description: >-
            The requester is trying to make an employee account, and did not provide credentials, or the token is
            invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Admin credentials required to proceed in action.
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: An account with this email already exists.
    delete:
      summary: Delete all accounts
      description: >-
        Allows a CUSports admin to delete every account in the Account
        service, so the database is clean when testing.
      operationId: deleteAllAccounts
      tags:
        - Accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All accounts were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update'
              example:
                message: All accounts have been successfully deleted.
        '401':
          description: >-
            The requester did not provide credentials, or the token is
            invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Valid admin credentials are required.
        '403':
          description: The requester is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The user is not authorized to proceed with that action.
  /accounts/{id}:
    get:
      summary: Look up an account by user id
      description: >-
        Allows a CUSports admin to look up any account, customer or employee,
        by its user id.
      operationId: getAccountById
      tags:
        - Accounts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user account.
          schema:
            type: string
      responses:
        '200':
          description: The account's information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '403':
          description: The requester is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Only admins can look up accounts.
        '404':
          description: No account exists with that user id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The user was not found.
    patch:
      summary: Change Preferences or Password
      description: Allows a registered customer to change their preferences or their password. The customer must provide their old password in order to change their password.
      operationId: updateAccountInfo
      tags:
        - Accounts
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user account.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update'
      responses:
        '200':
          description: Account successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update'
              examples:
                updatePassword:
                  value:
                    message: Password has been successfully updated.
                updatePreference:
                  value:
                    message: Preference has been successfully changed.
        '400':
          description: The update request contains invalid information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPassword:
                  value:
                    message: The new password is invalid.
                invalidPrefUpdate:
                  value:
                    message: The requested preference change is invalid.
        '401':
          description: The current password provided is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: The current password is incorrect.
    delete:
      summary: Delete an account by user id
      description: >-
        Allows a CUSports admin to delete a single account by its user id.
        This covers both customer accounts, to remove users who are no longer
        wanted as customers, and employee accounts (BU, admin, CSR, warehouse,
        or shipper), to remove access when employment changes.
      operationId: deleteAccountById
      tags:
        - Accounts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user account.
          schema:
            type: string
      responses:
        '200':
          description: The account was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update'
              examples:
                customer:
                  value:
                    message: deletion successful
                employee:
                  value:
                    message: Employee account has been successfully deleted.
        '401':
          description: >-
            The requester did not provide credentials, the token is invalid,
            or the requester is not an employee or admin account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                customer:
                  value:
                    message: Unauthorized action.
                employee:
                  value:
                    message: The action is forbidden due to missing credentials.
        '403':
          description: >-
            The requester is signed in as a CUSports employee but is not an
            admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                customer:
                  value:
                    message: Invalid credentials, unable to proceed in action.
                employee:
                  value:
                    message: The intended action cannot be performed due to incorrect credentials.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Account:
      type: object
      required:
        - account_id
        - name
        - email
        - password
        - account_type
      properties:
        account_id:
          type: string
          readOnly: true
          description: The unique identifier of the account, assigned by the server.
        name:
          type: string
          description: The account holder's full name.
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        preferences:
          type: object
          properties:
            payment:
              type: string
              description: User's preferred payment method.
              enum:
                - PayPal
                - credit_card
                - debit_card
            notifications:
              type: string
              description: User's preferred method of recieving notifications.
              enum:
                - SMS
                - Email
            promotion:
              type: boolean
              description: Whether the user opts in to promotional messages.
        account_type:
          type: array
          description: The roles assigned to this account. An account may hold more than one.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccountType'
        last_login_date:
          type: string
          format: date-time
          readOnly: true
    CustomerAccount:
      description: >-
        An Account whose account_type holds only the customer user type. Used
        when anybody signs up for a customer account.
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            account_type:
              type: array
              description: The customer role assigned to this account.
              maxItems: 1
              items:
                type: string
                enum:
                  - customer
    EmployeeAccount:
      description: >-
        An Account whose account_type holds exactly one of the five employee
        user types. Used when an admin adds an employee account.
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            account_type:
              type: array
              description: The single employee role assigned to this account.
              maxItems: 1
              items:
                $ref: '#/components/schemas/EmployeeAccountType'
    EmployeeAccountType:
      type: string
      description: The five CUSports employee user types.
      enum:
        - BU
        - admin
        - CSR
        - warehouse
        - shipper
    AccountType:
      type: string
      enum:
        - customer
        - BU
        - admin
        - warehouse
        - shipper
        - CSR
    Update:
      type: object
      description: >-
        Changes one account field. For most fields, send updateField and
        updateValue. To change the password, send updatePassword instead.
      properties:
        updateField:
          type: string
          description: Name of the account field being updated.
          example: email
        updateValue:
          type: string
          description: The new value for the field.
          example: new.email@example.com
        updatePassword:
          type: object
          description: Used only when changing the password.
          required:
            - currentPassword
            - newPassword
          properties:
            currentPassword:
              type: string
              format: password
              writeOnly: true
              description: The user's existing password.
            newPassword:
              type: string
              format: password
              writeOnly: true
              description: >-
                The new password. Must be at least 8 characters long and
                include an uppercase letter, a lowercase letter, a number, and
                a special character.
              minLength: 8
            message:
              type: string
              readOnly: true
              description: Result of the password update, returned in the response.
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
    UserIDResponse:
      type: object
      properties:
        userID:
          type: string
